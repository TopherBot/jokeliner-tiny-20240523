[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jokeliner-tiny-20240523"
version = "0.1.0"
description = "Tiny CLI that prints a random joke"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["cli", "joke", "tiny", "example"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.scripts]
# console entry point – installs a `jokeliner` command
jokeliner = "jokeliner.cli:main"

[project.optional-dependencies]
# Development‑only extras
dev = [
    "pytest>=7",
    "ruff",
]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "C90"]
